<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>강의자료</title>
<meta name="description" content="연수에서 쓴 강의안과 실습파일 모음. 날짜가 지나면 '완료', 앞이면 '예정'으로 저절로 바뀝니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
:root{
  --bg:#F5F4F0; --card:#FFFFFF; --ink:#1C1E22; --soft:#62666E; --line:#E2E0DA; --chip:#ECEAE4;
  --acc:#2563A8; --acc-bg:#EAF0F8; --acc-line:#C9D7EA;
  --soon:#8A5A00; --soon-bg:#FFF4D6; --soon-line:#E9C97A;
  --done:#2E6B3F; --done-bg:#E5F2E8;
  --f:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);word-break:keep-all}
a{color:inherit}
.wrap{max-width:920px;margin:0 auto;padding:0 16px 80px}
/* 위 띠: 사이트 안 이동(디자인 레퍼런스 ↔ 강의자료) */
.top{padding:22px 0 0}
.top small{display:block;font-size:13px;color:var(--soft);line-height:1.6}
.tabs{display:flex;gap:4px;margin:14px -16px 0;padding:0 16px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:none;padding:12px 14px 13px;font-size:16px;font-weight:700;text-decoration:none;color:var(--soft);border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs a[aria-current=page]{color:var(--acc);border-bottom-color:var(--acc)}
/* 머리말 */
.hero{margin:0 -16px;padding:40px 16px 36px;background:var(--acc-bg);border-bottom:1px solid var(--acc-line)}
.hero h1{margin:0;font-size:clamp(30px,6vw,46px);font-weight:900;letter-spacing:-.03em;line-height:1.2}
.hero h1 em{font-style:normal;color:var(--acc)}
.hero p{margin:12px 0 0;font-size:16px;line-height:1.7;color:var(--soft);max-width:56ch}
/* 목록 머리: 제목 · 개수 · 나누기 */
.head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin:34px 0 0}
.head h2{margin:0;font-size:22px;font-weight:900;letter-spacing:-.02em}
.head h2 em{font-style:normal;color:var(--acc);margin-left:6px}
.head small{font-size:13.5px;color:var(--soft)}
.seg{display:inline-flex;background:var(--chip);border-radius:999px;padding:3px;margin:14px 0 0}
.seg button{border:0;background:none;font:500 14px var(--f);padding:7px 14px;border-radius:999px;cursor:pointer;color:var(--soft);min-height:36px}
.seg button em{font-style:normal;margin-left:4px;font-size:12px}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.list{display:flex;flex-direction:column;gap:14px;margin:16px 0 0;padding:0;list-style:none}
/* 소통방: 강의 중에 들어가는 곳이라 맨 위, 강조 배경 */
.chat{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;padding:20px;border:1px solid var(--acc-line);border-radius:14px;background:var(--acc-bg)}
.ico{display:grid;place-items:center;width:52px;height:52px;border-radius:12px;background:var(--acc);color:#fff}
.ico svg{width:26px;height:26px}
.chat b{display:block;font-size:17px}
.chat p{margin:4px 0 0;font-size:14.5px;line-height:1.6;color:var(--soft)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:10px;font:700 15px var(--f);text-decoration:none;white-space:nowrap;
  border:1px solid var(--acc);background:var(--acc);color:#fff;cursor:pointer}
.btn.ghost{background:var(--card);color:var(--acc)}
.btn svg{width:18px;height:18px}
.btn[aria-disabled=true]{border-color:var(--line);background:var(--chip);color:var(--soft);cursor:default}
/* 강의 카드 */
.lec{display:grid;grid-template-columns:auto 1fr;gap:16px;padding:20px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.lec .ico{background:var(--acc-bg);color:var(--acc)}
.lec.done .ico{background:var(--chip);color:var(--soft)}
.when{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.when span{font-weight:400;color:var(--soft);font-size:14px}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:13px;font-weight:700;border:1px solid transparent}
.badge.soon{background:var(--soon-bg);color:var(--soon);border-color:var(--soon-line)}
.badge.today{background:var(--acc);color:#fff}
.badge.done{background:var(--done-bg);color:var(--done)}
.badge.ex{background:var(--chip);color:var(--soft)}
.lec h3{margin:8px 0 0;font-size:18px;line-height:1.4;letter-spacing:-.01em}
.lec p{margin:4px 0 0;font-size:14.5px;line-height:1.65;color:var(--soft)}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;margin:8px 0 0;padding:0;list-style:none;font-size:13.5px;color:var(--soft)}
.meta li::before{content:"· ";color:var(--line)}
.meta li:first-child::before{content:""}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0 0}
.tags span{font-size:12.5px;padding:2px 9px;border-radius:999px;background:var(--chip);color:var(--soft)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0}
.acts small{font-weight:500;opacity:.8}
.empty{padding:40px 0;text-align:center;color:var(--soft)}
footer{margin-top:48px;font-size:13px;color:var(--soft);line-height:1.7}
a:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media (max-width:560px){
  .chat{grid-template-columns:auto 1fr}
  .chat .btn{grid-column:1 / -1}
  .lec{grid-template-columns:1fr;gap:10px}
  .lec .ico{width:40px;height:40px;border-radius:10px}
  .lec .ico svg{width:22px;height:22px}
  .acts .btn{flex:1 1 auto}
}
@media print{.tabs,.seg,.chat{display:none}.hero{background:none}.lec{break-inside:avoid}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <small>직접 만들어 운영하는 <b>비공식</b> 자료 모음입니다 · <span id="stamp"></span></small>
    <nav class="tabs" aria-label="사이트">
      <a href="../index.html">디자인 레퍼런스</a>
      <a href="./" aria-current="page">강의자료</a>
    </nav>
  </div>

  <section class="hero">
    <h1 id="title">강의자료</h1>
    <p id="lead"></p>
  </section>

  <div class="head">
    <h2 id="listTitle">강의자료<em id="total"></em></h2>
    <small id="summary"></small>
  </div>
  <div class="seg" id="seg" role="group" aria-label="강의 나누기">
    <button type="button" data-s="" aria-pressed="true">전체<em></em></button>
    <button type="button" data-s="soon" aria-pressed="false">예정<em></em></button>
    <button type="button" data-s="done" aria-pressed="false">완료<em></em></button>
  </div>
  <ul class="list" id="list"></ul>

  <footer id="foot">'예정' · '완료'는 강의 날짜와 오늘 날짜를 견주어 저절로 붙습니다. 개인정보가 담긴 원본 자료는 올리지 않습니다.</footer>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// 저장소 뿌리 기준 경로(data/lectures.json에 적는 모양) → 이 페이지 기준. 바깥 주소는 그대로
const href = p => /^(https?:)?\/\//.test(p) ? p : '../' + String(p).replace(/^\.?\//, '');
const ICON = {
  chat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 14l-3 -3h-7a1 1 0 0 1 -1 -1v-6a1 1 0 0 1 1 -1h9a1 1 0 0 1 1 1v10"/><path d="M14 15v2a1 1 0 0 1 -1 1h-7l-3 3v-10a1 1 0 0 1 1 -1h2"/></svg>',
  board: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h18"/><path d="M4 4v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2 -2v-10"/><path d="M12 16v4"/><path d="M9 20h6"/><path d="M8 12l3 -3l2 2l3 -3"/></svg>',
  out: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6h-6a2 2 0 0 0 -2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-6"/><path d="M11 13l9 -9"/><path d="M15 4h5v5"/></svg>',
  down: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2 -2v-2"/><path d="M7 11l5 5l5 -5"/><path d="M12 4v12"/></svg>'
};
const DOW = '일월화수목금토';
// 날짜는 'YYYY-MM-DD' 그대로 읽는다(new Date('2026-11-24')는 UTC로 읽혀 하루 밀릴 수 있다)
const ymd = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, m - 1, d); };
const fmt = s => { const t = ymd(s); return `${t.getFullYear()}. ${t.getMonth() + 1}. ${t.getDate()}.(${DOW[t.getDay()]})`; };
const today = (() => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); })();
const stateOf = l => { const t = ymd(l.date); return t > today ? 'soon' : +t === +today ? 'today' : 'done'; };
const BADGE = {soon: '예정', today: '오늘', done: '완료'};
let data = null, pick = '';

function card(l){
  const s = stateOf(l), past = s === 'done';
  const acts = [];
  if (l.deck) acts.push(`<a class="btn" href="${esc(href(l.deck))}" target="_blank" rel="noopener">강의안 열기 ${ICON.out}</a>`);
  (l.files || []).forEach(f => acts.push(`<a class="btn ghost" href="${esc(href(f.href))}" download>${ICON.down} ${esc(f.name)}${f.kind ? ` <small>${esc(f.kind)}</small>` : ''}</a>`));
  if (!acts.length) acts.push(`<span class="btn ghost" aria-disabled="true">${past ? '자료 정리 중' : '강의 후 올라옵니다'}</span>`);
  const meta = [l.time, l.place, l.audience].filter(Boolean);
  return `<li class="lec${past ? ' done' : ''}">
    <span class="ico">${ICON.board}</span>
    <div>
      <div class="when"><time datetime="${esc(l.date)}">${esc(fmt(l.date))}</time><span class="badge ${s}">${BADGE[s]}</span>${l.sample ? '<span class="badge ex" title="형식을 보여 주는 가상 예시">예시</span>' : ''}</div>
      <h3>${esc(l.title)}</h3>
      ${l.desc ? `<p>${esc(l.desc)}</p>` : ''}
      ${meta.length ? `<ul class="meta">${meta.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}
      ${(l.tags || []).length ? `<div class="tags">${l.tags.map(t => `<span>${esc(t)}</span>`).join('')}</div>` : ''}
      <div class="acts">${acts.join('')}</div>
    </div>
  </li>`;
}
function render(){
  const ls = data.lectures.map(l => ({...l, s: stateOf(l)}));
  const soon = ls.filter(l => l.s !== 'done').sort((a, b) => ymd(a.date) - ymd(b.date));   // 가까운 강의부터
  const done = ls.filter(l => l.s === 'done').sort((a, b) => ymd(b.date) - ymd(a.date));   // 최근 강의부터
  const n = {'': ls.length, soon: soon.length, done: done.length};
  document.querySelectorAll('#seg button').forEach(b => { b.querySelector('em').textContent = n[b.dataset.s]; b.setAttribute('aria-pressed', b.dataset.s === pick); });
  const rows = pick === 'soon' ? soon : pick === 'done' ? done : soon.concat(done);
  const c = data.chat || {};
  // 소통방: chat 항목이 있으면 보이고(주소가 비면 '준비 중'), 항목을 지우면 사라진다
  const chat = data.chat && pick !== 'done' ? `<li class="chat"><span class="ico">${ICON.chat}</span><div><b>${esc(c.title || '강의 소통방')}</b>${c.desc ? `<p>${esc(c.desc)}</p>` : ''}</div>
    ${c.url ? `<a class="btn" href="${esc(c.url)}" target="_blank" rel="noopener">들어가기 ${ICON.out}</a>` : '<span class="btn" aria-disabled="true">준비 중</span>'}</li>` : '';
  $('#list').innerHTML = chat + (rows.length ? rows.map(card).join('') : `<li class="empty">${pick === 'soon' ? '잡힌 강의가 아직 없습니다.' : '자료가 아직 없습니다.'}</li>`);
}

fetch('../data/lectures.json', {cache: 'no-cache'}).then(r => r.json()).then(d => {
  data = d; d.lectures = d.lectures || [];
  const name = [d.title, d.title_em].filter(Boolean).join(' ') || '강의자료';
  document.title = name;
  $('#title').innerHTML = d.title_em ? `${esc(d.title)} <em>${esc(d.title_em)}</em>` : esc(name);
  $('#listTitle').firstChild.textContent = name;
  $('#lead').textContent = d.lead || '';
  const k = d.lectures.filter(l => stateOf(l) === 'done').length;
  $('#total').textContent = d.lectures.length + '개';
  $('#summary').textContent = `강의 ${d.lectures.length}개 · 완료 ${k} · 예정 ${d.lectures.length - k}`;
  if (d.updated) $('#stamp').textContent = fmt(d.updated).replace(/\(.\)$/, '') + ' 기준';
  if (d.lectures.some(l => l.sample)) $('#foot').insertAdjacentHTML('afterbegin', "'예시' 꼬리표가 붙은 강의는 형식을 보여 주는 가상 예시입니다. ");
  render();
}).catch(() => { $('#list').innerHTML = '<li class="empty">목록을 불러오지 못했습니다.</li>'; });

$('#seg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; pick = b.dataset.s; render(); });
</script>
</body>
</html>
