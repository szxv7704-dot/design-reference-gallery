<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>발표자료 디자인 레퍼런스</title>
<meta name="description" content="계획안 발표자료(PPT·HTML)를 위한 표지·도식 디자인 레퍼런스 모음. 모든 내용은 가상 예시입니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
:root{
  --bg:#F5F4F0; --card:#FFFFFF; --ink:#1C1E22; --soft:#62666E; --line:#E2E0DA;
  --exp:#C2552B; --prac:#2563A8; --chip:#ECEAE4;
  --f:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);word-break:keep-all}
a{color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding:40px 16px 80px}
header h1{font-size:clamp(26px,4vw,40px);font-weight:900;letter-spacing:-.02em;margin:0}
header p{margin:10px 0 0;color:var(--soft);line-height:1.6;max-width:62ch}
.stats{display:flex;gap:20px;margin-top:18px;font-size:14px;color:var(--soft)}
.stats b{color:var(--ink);font-size:20px;margin-right:4px}

.bar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);
  margin:28px -16px 0;padding:12px 16px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:flex;background:var(--chip);border-radius:999px;padding:3px}
.seg button{border:0;background:none;font:500 14px var(--f);padding:7px 14px;border-radius:999px;cursor:pointer;color:var(--soft)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
select,input{font:14px var(--f);padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);min-width:0}
input{flex:1 1 180px}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--prac);outline-offset:2px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:22px;margin-top:24px}
.card{background:var(--card);border-radius:14px;overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column;
  text-decoration:none;transition:transform .15s ease,box-shadow .15s ease}
.card:hover{transform:translateY(-2px);box-shadow:0 10px 28px -14px rgba(0,0,0,.25)}
.thumb{aspect-ratio:16/9;background:var(--chip);display:block;width:100%;object-fit:cover;border-bottom:1px solid var(--line)}
.body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--soft)}
.type{font-weight:700;padding:2px 8px;border-radius:999px;color:#fff}
.type.exp{background:var(--exp)} .type.prac{background:var(--prac)}
.tag{background:var(--chip);padding:2px 8px;border-radius:999px}
.card h2{font-size:17px;line-height:1.35;margin:0;font-weight:700}
.topic{font-size:13px;color:var(--soft);margin:0}
.take{font-size:13px;line-height:1.55;margin:0;padding-top:8px;border-top:1px dashed var(--line)}
.take b{color:var(--ink)}
.sw{display:flex;margin-top:auto;padding-top:6px;height:12px}
.sw i{flex:1;height:8px}
.sw i:first-child{border-radius:4px 0 0 4px}.sw i:last-child{border-radius:0 4px 4px 0}
.empty{padding:60px 0;text-align:center;color:var(--soft)}
footer{margin-top:56px;font-size:13px;color:var(--soft);line-height:1.7}
@media (prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>발표자료 디자인 레퍼런스</h1>
    <p>계획안 발표(PPT·HTML)에 쓸 표지와 도식 장표 레퍼런스입니다. <b>실험형</b>은 교육 밖 세계를 빌린 표지, <b>실무형</b>은 움직임으로 구조를 보여 주는 도식입니다. 카드를 누르면 원본 페이지(설계 메모·PPT 이식법 포함)가 열립니다.</p>
    <div class="stats" id="stats"></div>
  </header>

  <div class="bar" role="search">
    <div class="seg" id="seg">
      <button type="button" data-t="" aria-pressed="true">전체</button>
      <button type="button" data-t="실험형" aria-pressed="false">실험형</button>
      <button type="button" data-t="실무형" aria-pressed="false">실무형</button>
    </div>
    <select id="topic" aria-label="주제"><option value="">모든 주제</option></select>
    <input id="q" type="search" placeholder="검색: 제목, 구조, 패턴, 스타일…" aria-label="검색">
  </div>

  <div class="grid" id="grid"></div>

  <footer>모든 장표의 기관명·계획안·수치는 가상 예시입니다. 실제 기관과 관계없습니다. 사진 출처와 라이선스는 각 원본 페이지에 적혀 있습니다.</footer>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hex = c => /^#[0-9a-f]{3,8}$/i.test(c) ? c : '#ccc';
let all = [], type = '';

function render(){
  const topic = $('#topic').value, q = $('#q').value.trim().toLowerCase();
  const rows = all.filter(r =>
    (!type || r.type === type) && (!topic || r.topic === topic) &&
    (!q || [r.title, r.structure, r.pattern, r.style, r.field, r.metaphor, r.takeaway, r.summary].join(' ').toLowerCase().includes(q)));
  $('#grid').innerHTML = rows.length ? rows.map(r => `
    <a class="card" href="${esc(r.file)}${r.v ? '?v=' + esc(r.v) : ''}" target="_blank" rel="noopener">
      <img class="thumb" src="${esc(r.thumb)}${r.v ? '?v=' + esc(r.v) : ''}" alt="" loading="lazy">
      <div class="body">
        <div class="meta">
          <span class="type ${r.type === '실험형' ? 'exp' : 'prac'}">${esc(r.type)}</span>
          ${r.structure ? `<span class="tag">${esc(r.structure)}</span>` : ''}
          ${r.pattern ? `<span class="tag">${esc(r.pattern)}</span>` : ''}
          ${r.field ? `<span class="tag">${esc(r.field)}</span>` : ''}
          <span>#${r.no} · ${esc(r.date)}</span>
        </div>
        <h2>${esc(String(r.title).replace(/^레퍼런스\s*#\d+\s*/, ''))}</h2>
        <p class="topic">${esc(r.topic)}</p>
        ${r.takeaway ? `<p class="take"><b>가져갈 장치</b> · ${esc(r.takeaway)}</p>` : ''}
        <div class="sw">${(r.palette || []).slice(0, 6).map(c => `<i style="background:${hex(c)}"></i>`).join('')}</div>
      </div>
    </a>`).join('') : '<p class="empty">조건에 맞는 레퍼런스가 없습니다.</p>';
}

fetch('data/rounds.json', {cache: 'no-cache'}).then(r => r.json()).then(d => {
  all = d.sort((a, b) => b.no - a.no);
  const n = t => all.filter(r => r.type === t).length;
  $('#stats').innerHTML = `<span><b>${all.length}</b>개</span><span><b>${n('실험형')}</b>실험형</span><span><b>${n('실무형')}</b>실무형</span>`;
  [...new Set(all.map(r => r.topic))].sort().forEach(t => $('#topic').insertAdjacentHTML('beforeend', `<option>${esc(t)}</option>`));
  render();
}).catch(() => { $('#grid').innerHTML = '<p class="empty">목록을 불러오지 못했습니다.</p>'; });

$('#seg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  type = b.dataset.t;
  document.querySelectorAll('#seg button').forEach(x => x.setAttribute('aria-pressed', x === b));
  render();
});
$('#topic').addEventListener('change', render);
$('#q').addEventListener('input', render);
</script>
</body>
</html>
