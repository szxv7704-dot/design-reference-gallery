<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>발표·인쇄물 디자인 레퍼런스</title>
<meta name="description" content="계획안 발표자료(PPT·HTML)를 위한 표지·도식 디자인 레퍼런스 모음. 모든 내용은 가상 예시입니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
:root{
  --bg:#F5F4F0; --card:#FFFFFF; --ink:#1C1E22; --soft:#62666E; --line:#E2E0DA;
  --exp:#C2552B; --prac:#2563A8; --chip:#ECEAE4;
  --f:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);word-break:keep-all}
a{color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding:40px 16px 80px}
header h1{font-size:clamp(26px,4vw,40px);font-weight:900;letter-spacing:-.02em;margin:0}
header p{margin:10px 0 0;color:var(--soft);line-height:1.6;max-width:62ch}
.stats{display:flex;gap:20px;margin-top:18px;font-size:14px;color:var(--soft)}
.stats b{color:var(--ink);font-size:20px;margin-right:4px}

.bar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);
  margin:28px -16px 0;padding:12px 16px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:flex;background:var(--chip);border-radius:999px;padding:3px}
.seg button{border:0;background:none;font:500 14px var(--f);padding:7px 14px;border-radius:999px;cursor:pointer;color:var(--soft)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
select,input{font:14px var(--f);padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);min-width:0}
input{flex:1 1 180px}
button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--prac);outline-offset:2px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:22px;margin-top:24px}
.card{background:var(--card);border-radius:14px;overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column;
  text-decoration:none;transition:transform .15s ease,box-shadow .15s ease}
.card:hover{transform:translateY(-2px);box-shadow:0 10px 28px -14px rgba(0,0,0,.25)}
.thumb{aspect-ratio:16/9;background:var(--chip);display:block;width:100%;object-fit:cover;border-bottom:1px solid var(--line)}
.body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--soft)}
.type{font-weight:700;padding:2px 8px;border-radius:999px;color:#fff}
.type.exp{background:var(--exp)} .type.prac{background:var(--prac)} .type.kit{background:#3F6B4E} .type.print{background:#7754B6}
.tag{background:var(--chip);padding:2px 8px;border-radius:999px}
.card h2{font-size:17px;line-height:1.35;margin:0;font-weight:700}
.topic{font-size:13px;color:var(--soft);margin:0}
.take{font-size:13px;line-height:1.55;margin:0;padding-top:8px;border-top:1px dashed var(--line)}
.take b{color:var(--ink)}
.sw{display:flex;margin-top:auto;padding-top:6px;height:12px}
.sw i{flex:1;height:8px}
.sw i:first-child{border-radius:4px 0 0 4px}.sw i:last-child{border-radius:0 4px 4px 0}
.chips{flex-basis:100%;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--soft)}
.chips span{margin-right:2px}
.chips button{border:1px solid var(--line);background:var(--card);font:500 13px var(--f);padding:5px 12px;border-radius:999px;cursor:pointer;color:var(--ink)}
.chips button em{font-style:normal;color:var(--soft);margin-left:4px;font-size:12px}
.chips button[aria-pressed=true]{background:var(--prac);border-color:var(--prac);color:#fff}
.chips button[aria-pressed=true] em{color:#dbe7f5}
.tag.sec{background:#E3ECF8;color:#1F4E86;font-weight:700}
.tag.fam{background:#F6E5DC;color:#8A3517;font-weight:700}
.tag.info{background:#E3ECF8;color:#1F4E86;font-weight:700}
.tag.mod{background:#fff;color:#1F4E86;box-shadow:inset 0 0 0 1px #BFD0E6}
.tag.no{background:#FBE3E1;color:#A1251B;font-weight:700}
.chips button:disabled{opacity:.45;cursor:default} #print{border-top:1px solid var(--line);padding-top:8px} #print button[aria-pressed=true]{background:#7754B6;border-color:#7754B6}
.compat{font-size:12.5px;color:var(--soft);margin:6px 0 0}
.note{font-size:12.5px;color:#A1251B;margin:6px 0 0}
.empty{padding:60px 0;text-align:center;color:var(--soft)}
footer{margin-top:56px;font-size:13px;color:var(--soft);line-height:1.7}
@media (max-width:600px){.bar{position:static}}
@media (prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>발표·인쇄물 디자인 레퍼런스</h1>
    <p>발표자료의 <b>표지·요소</b>와 포스터·팸플릿의 <b>인쇄물 콘셉트</b>를 모은 갤러리입니다. 인쇄물 콘셉트는 <b>F → G → H → D → C → A → B → E → I</b> 우선순위로 9개 분야, 총 36개 장표를 제공합니다. 카드를 누르면 디자인 원본을 크게 보고 SVG·PNG로 저장할 수 있습니다.</p>
    <div class="stats" id="stats"></div>
  </header>

  <div class="bar" role="search">
    <div class="seg" id="seg">
      <button type="button" data-t="" aria-pressed="true">전체</button>
      <button type="button" data-t="실험형" aria-pressed="false">표지</button>
      <button type="button" data-t="계열키트" aria-pressed="false">계열 키트</button>
      <button type="button" data-t="실무형" aria-pressed="false">요소</button>
      <button type="button" data-t="콘셉트형" aria-pressed="false">인쇄물 콘셉트</button>
    </div>
    <select id="topic" aria-label="주제"><option value="">모든 주제</option></select>
    <input id="q" type="search" placeholder="검색: 제목, 구조, 패턴, 스타일…" aria-label="검색">
    <div class="chips" id="print"><span>인쇄물 분야</span></div>
    <div class="chips" id="fam" role="group" aria-label="표지 계열"><span>표지 계열</span></div>
    <div class="chips" id="info" role="group" aria-label="정보 유형"><span>정보 유형</span></div>
    <div class="chips" id="mod" role="group" aria-label="모듈" hidden><span>모듈</span></div>
    <div class="chips" id="sec" role="group" aria-label="계획안 속 위치"><span>계획안 속 위치</span></div>
  </div>

  <div class="grid" id="grid"></div>

  <footer>모든 장표의 기관명·계획안·수치는 가상 예시입니다. 실제 기관과 관계없습니다. 사진 출처와 라이선스는 각 원본 페이지에 적혀 있습니다.</footer>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hex = c => /^#[0-9a-f]{3,8}$/i.test(c) ? c : '#ccc';
let all = [], type = '', sec = '', fam = '', info = '', mod = '', printField = '';
const PRINT_FIELDS={"F":"디지털·IT","G":"건축·공간·지도","H":"게임·놀이","D":"영화·출판·음악","C":"유통·상업","A":"문서·기록","B":"여행·교통·물류","E":"과학·자연","I":"시간·감성·일상"};
// 표지 분위기 계열 (실험형의 family). 실무형은 families에 어울리는 계열을 적는다
const FAMILIES = {A:'픽셀 게임', B:'미니멀 스튜디오', C:'경쾌한 놀이 오브젝트', D:'인쇄·종이 에디토리얼', E:'자연 재질', F:'관측·중계 인포그래픽', G:'어두운 콘셉트', H:'전통 공예·문양'};
// 본문 요소의 정보 유형 (0개인 유형도 보여 빈칸을 드러낸다)
const INFO_TYPES = ['비전 체계도', '현안→해결방안', '배경·목적', '분류·유목화', '흐름·절차', '조직·체계', '일정', '핵심 수치', '비교·순위', '추이', '구성비', '표·목록', '지도·분포'];
// 장표 안의 모듈 (요소의 modules, 쓰인 것만 칩으로 보인다)
const MODULES = ['셰브런 단계', '현안→해결 표', '위계도', '방사형', '순환', '깔때기', '매트릭스', '비교 VS', '카드 묶음', '수치 타일', '막대', '선', '도넛', '표', '타임라인', '간트', '지도'];
// 계획안 발표 순서 (실무형의 section)
const SECTIONS = ['현황', '목표 및 지표', '세부과제', '추진체계', '일정 및 예산'];
const secOf = r => r.section || '';
const famLabel = k => k ? `${k} ${FAMILIES[k] || ''}` : '';
// 계열 필터: 그 계열의 표지 + 그 계열과 어울리는 요소(덱 제외 요소는 빼고)
const inFam = r => r.type === '실무형' ? (r.families || []).includes(fam) && r.deck_ok !== false : r.family === fam;
const KIND = {'실험형': '표지', '계열키트': '계열 키트', '실무형': '요소', '콘셉트형': '인쇄물'};
const ORDER = {'실험형': 0, '계열키트': 1, '실무형': 2, '콘셉트형': 3};

function render(){
  const topic = $('#topic').value, q = $('#q').value.trim().toLowerCase();
  const rows = all.filter(r =>
    (!type || r.type === type) && (!topic || r.topic === topic) && (!sec || secOf(r) === sec) &&
    (!fam || inFam(r)) && (!printField || r.print_field === printField) && (!info || r.info_type === info) && (!mod || (r.modules || []).includes(mod)) &&
    (!q || [r.title, r.print_field, secOf(r), famLabel(r.family), r.info_type, (r.modules || []).join(' '), r.texture, r.structure, r.pattern, r.style, r.field, r.metaphor, r.takeaway, r.summary].join(' ').toLowerCase().includes(q)))
    .sort((a, b) => fam ? (ORDER[a.type] ?? 3) - (ORDER[b.type] ?? 3) || b.no - a.no : b.no - a.no);
  $('#grid').innerHTML = rows.length ? rows.map(r => `
    <a class="card" href="${esc(r.file)}${r.v ? '?v=' + esc(r.v) : ''}" target="_blank" rel="noopener">
      <img class="thumb" src="${esc(r.thumb)}${r.v ? '?v=' + esc(r.v) : ''}" alt="" loading="lazy">
      <div class="body">
        <div class="meta">
          <span class="type ${r.type === '실험형' ? 'exp' : r.type === '계열키트' ? 'kit' : r.type === '콘셉트형' ? 'print' : 'prac'}">${esc(KIND[r.type] || r.type)}</span>
          ${r.print_field ? `<span class="tag fam">${esc(r.print_field + ' ' + PRINT_FIELDS[r.print_field])}</span>` : ''}
          ${r.family ? `<span class="tag fam">${esc(famLabel(r.family))}</span>` : ''}
          ${r.info_type ? `<span class="tag info">${esc(r.info_type)}</span>` : ''}
          ${(r.modules || []).map(m => `<span class="tag mod">${esc(m)}</span>`).join('')}
          ${r.texture ? `<span class="tag">${esc(r.texture)}</span>` : ''}
          ${r.deck_ok === false ? '<span class="tag no">덱 제외</span>' : ''}
          ${r.section ? `<span class="tag">${esc(r.section)}</span>` : ''}
          ${r.structure ? `<span class="tag">${esc(r.structure)}</span>` : ''}
          ${r.pattern ? `<span class="tag">${esc(r.pattern)}</span>` : ''}
          ${r.field ? `<span class="tag">${esc(r.field)}</span>` : ''}
          <span>#${r.no} · ${esc(r.date)}</span>
        </div>
        <h2>${esc(String(r.title).replace(/^레퍼런스\s*#\d+\s*/, ''))}</h2>
        <p class="topic">${esc(r.topic)}</p>
        ${r.takeaway ? `<p class="take"><b>가져갈 장치</b> · ${esc(r.takeaway)}</p>` : ''}
        ${r.type === '실무형' && r.deck_ok !== false ? `<p class="compat">어울리는 계열 · ${(r.families || []).map(esc).join('·') || '—'}</p>` : ''}
        ${r.deck_ok === false && r.deck_note ? `<p class="note">${esc(r.deck_note)}</p>` : ''}
        <div class="sw">${(r.palette || []).slice(0, 6).map(c => `<i style="background:${hex(c)}"></i>`).join('')}</div>
      </div>
    </a>`).join('') : '<p class="empty">조건에 맞는 레퍼런스가 없습니다.</p>';
}

fetch('data/rounds.json', {cache: 'no-cache'}).then(r => r.json()).then(d => {
  all = d.sort((a, b) => b.no - a.no);
  const n = t => all.filter(r => r.type === t).length;
  $('#stats').innerHTML = `<span><b>${all.length}</b>개</span><span><b>${n('실험형')}</b>표지</span><span><b>${n('계열키트')}</b>계열 키트</span><span><b>${n('실무형')}</b>요소</span><span><b>${n('콘셉트형')}</b>인쇄물</span>`;
  const chip = (box, key, val, label, cnt) => $(box).insertAdjacentHTML('beforeend',
    `<button type="button" data-${key}="${esc(val)}" aria-pressed="${val === ''}"${cnt === 0 ? ' disabled' : ''}>${esc(label)}<em>${cnt}</em></button>`);
  chip('#print','p','','전체',n('콘셉트형'));
  Object.keys(PRINT_FIELDS).forEach(k => chip('#print','p',k,k+' '+PRINT_FIELDS[k],all.filter(r => r.print_field === k).length));
  chip('#fam', 'f', '', '전체', all.length);
  Object.keys(FAMILIES).forEach(k => { fam = k; chip('#fam', 'f', k, famLabel(k), all.filter(r => r.family === k).length); }); fam = '';
  chip('#info', 'i', '', '전체', n('실무형'));
  INFO_TYPES.forEach(t => chip('#info', 'i', t, t, all.filter(r => r.info_type === t).length));
  const used = MODULES.filter(m => all.some(r => (r.modules || []).includes(m)));
  if (used.length) {
    $('#mod').hidden = false;
    chip('#mod', 'm', '', '전체', all.filter(r => (r.modules || []).length).length);
    used.forEach(m => chip('#mod', 'm', m, m, all.filter(r => (r.modules || []).includes(m)).length));
  }
  [...new Set(all.map(r => r.topic))].sort().forEach(t => $('#topic').insertAdjacentHTML('beforeend', `<option>${esc(t)}</option>`));
  ['', ...SECTIONS].forEach(s => $('#sec').insertAdjacentHTML('beforeend',
    `<button type="button" data-s="${esc(s)}" aria-pressed="${s === ''}">${s || '전체'}<em>${s ? all.filter(r => secOf(r) === s).length : all.length}</em></button>`));
  render();
}).catch(() => { $('#grid').innerHTML = '<p class="empty">목록을 불러오지 못했습니다.</p>'; });

$('#seg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  type = b.dataset.t;
  if(type !== '콘셉트형'){printField='';document.querySelectorAll('#print button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.p===''));}
  document.querySelectorAll('#seg button').forEach(x => x.setAttribute('aria-pressed', x === b));
  render();
});
$('#sec').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  sec = b.dataset.s;
  document.querySelectorAll('#sec button').forEach(x => x.setAttribute('aria-pressed', x === b));
  render();
});
const pick = (box, key, set) => $(box).addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || b.disabled) return;
  set(b.dataset[key]);
  document.querySelectorAll(box + ' button').forEach(x => x.setAttribute('aria-pressed', x === b));
  render();
});
pick('#print','p',v=>{printField=v;type='콘셉트형';document.querySelectorAll('#seg button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.t===type));});
pick('#fam', 'f', v => fam = v);
pick('#info', 'i', v => info = v);
pick('#mod', 'm', v => mod = v);
$('#topic').addEventListener('change', render);
$('#q').addEventListener('input', render);
</script>
</body>
</html>
