<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>디자인 레퍼런스</title>
<meta name="description" content="사업 성과 공유회 · 사업 설명회 발표 자료와 인쇄·홍보물을 만들 때 쓰는 디자인 레퍼런스. 모든 내용은 가상 예시입니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
:root{
  --bg:#F5F4F0; --card:#FFFFFF; --ink:#1C1E22; --soft:#62666E; --line:#E2E0DA;
  --exp:#C2552B; --prac:#2563A8; --chip:#ECEAE4;
  --f:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);word-break:keep-all}
a{color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding:8px 16px 80px}
header h1{font-size:clamp(26px,4vw,40px);font-weight:900;letter-spacing:-.02em;margin:0}
header p{margin:10px 0 0;color:var(--soft);line-height:1.6;max-width:62ch}
/* 무엇을 하려고 하나요? — 목적 하나 = 타일 하나. 미리보기는 늘 보이고(터치에서도), 마우스 · 키보드로 올리면 크게 보기 */
.hub{margin:26px 0 0}
.hub h2{margin:0 0 12px;font-size:15px;font-weight:700}
.hub-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.tile{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:var(--card);text-decoration:none;color:var(--ink);overflow:hidden;
  transition:border-color .15s,box-shadow .15s,transform .15s}
.tile:hover,.tile:focus-visible{border-color:var(--ink);box-shadow:0 10px 24px -16px rgba(0,0,0,.35);transform:translateY(-2px)}
.tile[aria-current=true]{border-color:var(--prac);box-shadow:inset 0 0 0 1px var(--prac)}
.tile .pv{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);aspect-ratio:16/9}
.tile .pv img{width:100%;height:100%;object-fit:cover;display:block;background:var(--chip)}
.tile .pv.one{grid-template-columns:1fr}
.tile b{display:block;padding:10px 12px 0;font-size:15px;line-height:1.35}
.tile small{display:block;padding:3px 12px 12px;font-size:12.5px;line-height:1.45;color:var(--soft)}
.tile small em{font-style:normal;font-weight:700;color:var(--ink)}
.peek{position:absolute;z-index:20;width:min(620px,calc(100vw - 32px));background:var(--card);border:1px solid var(--ink);border-radius:14px;
  box-shadow:0 24px 60px -24px rgba(0,0,0,.45);overflow:hidden;pointer-events:none;opacity:0;transform:translateY(6px);transition:opacity .14s,transform .14s}
.peek.on{opacity:1;transform:none}
.peek .big{position:relative;aspect-ratio:16/9;background:var(--chip)}
.peek .big img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .35s}
.peek .big img.on{opacity:1}
.peek .strip{display:flex;gap:4px;padding:6px;background:var(--chip)}
.peek .strip i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.peek .strip i.on{background:var(--ink)}
.peek .txt{padding:12px 16px 14px}
.peek .txt b{display:block;font-size:16px}
.peek .txt p{margin:4px 0 0;font-size:13.5px;line-height:1.6;color:var(--soft)}
.peek .txt span{display:block;margin-top:8px;font-size:12.5px;font-weight:700;color:var(--prac)}
@media (max-width:1000px){.hub-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.hub-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.tile small{display:none}}
@media (prefers-reduced-motion:reduce){.tile,.peek,.peek .big img{transition:none}.tile:hover,.tile:focus-visible{transform:none}}
.note{margin:10px 0 0;font-size:13.5px;color:var(--soft);min-height:1.4em}
.note b{color:var(--ink);margin-right:6px}
/* 고르기 띠: 쓰임새 + 검색 / 무엇을 보여 주나 / 분위기 — 세 가지뿐 */
.bar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(6px);
  margin:28px -16px 0;padding:12px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:flex;flex-wrap:wrap;background:var(--chip);border-radius:999px;padding:3px}
.seg button{border:0;background:none;font:500 14px var(--f);padding:7px 14px;border-radius:999px;cursor:pointer;color:var(--soft)}
.seg button em{font-style:normal;color:var(--soft);margin-left:4px;font-size:12px}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
input{flex:1 1 200px;min-width:0;font:14px var(--f);padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.lbl{font-size:12.5px;font-weight:700;color:var(--soft);margin-right:2px;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chips[hidden]{display:none}
.chips button{border:1px solid var(--line);background:var(--card);font:500 13px var(--f);padding:5px 11px;border-radius:999px;cursor:pointer;color:var(--ink)}
.chips button em{font-style:normal;color:var(--soft);margin-left:4px;font-size:11.5px}
.chips button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.chips button[aria-pressed=true] em{color:#ddd}
.chips button:disabled{opacity:.4;cursor:default}
.chips button.gap{border-style:dashed}
/* 분위기: 이름 대신 그 계열 표지 한 장 */
.fams button{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 3px}
.fams img{width:44px;height:25px;object-fit:cover;border-radius:6px;display:block;background:var(--chip)}
.fams button.all{padding:5px 11px}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--prac);outline-offset:2px}
@media (max-width:600px){.bar{position:static}
  /* 좁은 화면: 칩 줄은 옆으로 밀어 보는 한 줄(페이지 가로 스크롤은 없음) */
  .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-bottom:2px}
  .chips::-webkit-scrollbar{display:none}
  .chips button,.lbl{flex:none}}
/* 카드: 썸네일 · 제목 한 줄 · 움직임 기호. 나머지는 누르면 뜨는 빠르게 보기 창에 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:18px;margin-top:22px}
.card{display:block;text-decoration:none;color:var(--ink);border-radius:12px;background:var(--card);border:1px solid var(--line);overflow:hidden;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px);box-shadow:0 10px 26px -14px rgba(0,0,0,.28)}
.card .th{position:relative;display:block;aspect-ratio:16/9;background:var(--chip)}
.card .th img{width:100%;height:100%;object-fit:cover;display:block}
.card .mo{position:absolute;left:8px;top:8px;min-width:26px;height:26px;padding:0 7px;border-radius:13px;background:rgba(20,22,26,.78);color:#fff;font-size:12px;line-height:26px;text-align:center}
.card .cap{display:flex;gap:8px;align-items:baseline;padding:10px 12px 12px}
.card .cap b{flex:1;min-width:0;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .cap small{flex:none;font-size:12px;color:var(--soft)}
.card.fail .th img,.card.hid .th img{filter:grayscale(.85);opacity:.6}
.card.fail,.card.hid{border-style:dashed}
.card .why{display:block;padding:0 12px 12px;margin-top:-6px;font-size:12px;line-height:1.5;color:#A1251B}
.empty{padding:60px 0;text-align:center;color:var(--soft)}
@media (prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}
/* 빠르게 보기 */
dialog.ql{width:min(1180px,calc(100vw - 32px));max-height:calc(100vh - 32px);padding:0;border:0;border-radius:16px;background:var(--card);color:var(--ink);box-shadow:0 30px 80px -20px rgba(0,0,0,.5)}
dialog.ql::backdrop{background:rgba(20,22,26,.55)}
.ql-in{display:grid;grid-template-columns:minmax(0,1fr) 300px;max-height:calc(100vh - 32px)}
.ql-view{background:#111;min-height:0}
.ql-view iframe{display:block;width:100%;height:min(72vh,720px);border:0;background:#fff}
.ql-side{padding:18px 18px 16px;display:flex;flex-direction:column;gap:10px;overflow:auto}
.ql-side h2{margin:0;font-size:18px;line-height:1.35}
.ql-side .tags{display:flex;flex-wrap:wrap;gap:5px}
.ql-side .tags span{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--chip)}
.ql-side p{margin:0;font-size:13.5px;line-height:1.6;color:var(--soft)}
.ql-side p b{color:var(--ink)}
.ql-side .sw{display:flex;height:10px;border-radius:5px;overflow:hidden}.ql-side .sw i{flex:1}
.ql-side .acts{display:flex;gap:8px;margin-top:auto;padding-top:6px}
.ql-side .acts a,.ql-side .acts button{flex:1;display:inline-flex;justify-content:center;align-items:center;min-height:40px;border-radius:999px;border:1px solid var(--line);background:var(--card);font:700 14px var(--f);text-decoration:none;color:var(--ink);cursor:pointer}
.ql-side .acts a{background:var(--ink);border-color:var(--ink);color:#fff}
@media (max-width:860px){dialog.ql{width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;border-radius:0}.ql-in{grid-template-columns:1fr;max-height:100dvh;height:100%;grid-template-rows:auto 1fr}.ql-view iframe{height:56vh}}
/* 사이트 안 이동: 디자인 레퍼런스 ↔ 강의자료 */
.tabs{display:flex;gap:4px;margin:0 -16px 26px;padding:0 16px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:none;padding:12px 14px 13px;font-size:16px;font-weight:700;text-decoration:none;color:var(--soft);border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs a[aria-current=page]{color:var(--prac);border-bottom-color:var(--prac)}
footer{margin-top:56px;font-size:13px;color:var(--soft);line-height:1.7}
footer button{border:0;background:none;padding:0;font:inherit;color:var(--ink);text-decoration:underline;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <nav class="tabs" aria-label="사이트">
    <a href="./" aria-current="page">디자인 레퍼런스</a>
    <a href="lectures/">강의안</a>
    <a href="lectures/videos.html">강의 영상</a>
    <a href="lectures/tools.html">업무도구</a>
  </nav>
  <header>
    <h1>디자인 레퍼런스</h1>
    <p>사업 <b>성과 공유회</b> · <b>사업 설명회</b> 발표 자료와 인쇄·홍보물을 만들 때 쓰는 레퍼런스입니다. 하려는 일을 먼저 고르세요. 장표를 누르면 그 자리에서 움직여 볼 수 있습니다.</p>
    <section class="hub" aria-labelledby="hubTitle">
      <h2 id="hubTitle">무엇을 하려고 하나요?</h2>
      <div class="hub-grid" id="hub"></div>
    </section>
  </header>

  <div class="bar" role="search" id="list">
    <div class="row">
      <div class="seg" id="role" role="group" aria-label="쓰임새">
        <button type="button" data-g="" aria-pressed="true">전체</button>
        <button type="button" data-g="표지" aria-pressed="false">표지</button>
        <button type="button" data-g="본문" aria-pressed="false">본문</button>
        <button type="button" data-g="목차·간지" aria-pressed="false">목차·간지</button>
        <button type="button" data-g="발표 틀" aria-pressed="false">발표 틀</button>
        <button type="button" data-g="인쇄·홍보물" aria-pressed="false">인쇄·홍보물</button>
      </div>
      <input id="q" type="search" placeholder="검색: 제목 · 주제 · 장치 · 번호(#109)" aria-label="검색">
    </div>
    <div class="row chips" id="kind" role="group" aria-label="무엇을 보여 주나"><span class="lbl">무엇을 보여 주나</span></div>
    <div class="row chips fams" id="fam" role="group" aria-label="분위기"><span class="lbl">분위기</span></div>
  </div>

  <p class="note" id="note"></p>
  <div class="grid" id="grid"></div>

  <footer>
    모든 장표의 기관명 · 수치는 가상 예시이고, 사진은 AI로 만든 것입니다. 만드는 기준은 <a href="docs/criteria.md">제작 기준</a>에 있습니다.
    <span id="hidNote"></span>
  </footer>
</div>

<dialog class="ql" id="ql" aria-labelledby="qlTitle">
  <div class="ql-in">
    <div class="ql-view"><iframe id="qlFrame" title="장표 미리보기" loading="lazy"></iframe></div>
    <div class="ql-side" id="qlSide"></div>
  </div>
</dialog>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hex = c => /^#[0-9a-f]{3,8}$/i.test(c) ? c : '#ccc';
let all = [], role = '', kind = '', fam = '', showHidden = false;
const FAMILIES = {A:'픽셀 게임', B:'미니멀 스튜디오', C:'경쾌한 놀이 오브젝트', D:'인쇄·종이 에디토리얼', E:'자연 재질', F:'관측·중계 인포그래픽', G:'어두운 콘셉트', H:'전통 공예·문양'};
// 분위기 칩에 붙는 그 계열 대표 표지
const FAM_COVER = {A: 9, B: 19, C: 7, D: 27, E: 17, F: 25, G: 74, H: 58};
// 무엇을 보여 주나 — 성과 공유회 흐름 순서의 정형 장표 유형(docs/criteria.md 3). 0개도 보여 빈칸을 드러낸다
const KINDS = ['사업 개요', '추진 체계', '추진 경과', '주요 추진 내용', '핵심 성과', '목표 대비 달성', '전년 대비·비교', '추이', '구성비', '참여 분포',
  '우수 사례', '참여자 목소리', '만족도', '전후 비교', '시사점·과제', '향후 계획', '단계·절차', '요약표', '자주 묻는 질문'];
const KIND_OF_INFO = {'배경·목적': '사업 개요', '비전 체계도': '사업 개요', '조직·체계': '추진 체계', '일정': '추진 경과', '분류·유목화': '주요 추진 내용',
  '핵심 수치': '핵심 성과', '비교·순위': '전년 대비·비교', '추이': '추이', '구성비': '구성비', '지도·분포': '참여 분포', '현안→해결방안': '시사점·과제',
  '흐름·절차': '단계·절차', '표·목록': '요약표'};
const kindOf = r => r.kind || KIND_OF_INFO[r.info_type] || '';
const ROLE_OF_TYPE = {'실험형': '표지', '실무형': '본문', '계열키트': '목차·간지', '인쇄물': '인쇄·홍보물'};
const ROLES = ['표지', '본문', '목차·간지', '발표 틀', '인쇄·홍보물'];
const ORDER = Object.fromEntries(ROLES.map((x, i) => [x, i]));
const ROLE_DESC = {'표지': '가장 큰 글자가 사업 이름. 덱의 첫 장, 분위기를 정한다', '본문': '머리말 + 결론 한 문장 제목 + 정형 장표 하나',
  '목차·간지': '목차 · 섹션 간지 · 마무리. 한 분위기의 덱 뼈대(계열 키트)', '발표 틀': '한 장이 아니라 여러 화면을 넘기는 진행 방식(허브 · 스크롤 · 카드 · 지도)',
  '인쇄·홍보물': '화면 발표가 아닌 종이 · 게시용: 포스터 · 리플렛 · 소식지 · 배너 · 티켓'};
const MO = {'모션': '▶', '인터랙션': '◉', '정지': ''};
const famHas = (r, k) => r.family ? r.family === k : (r.families || []).includes(k) && r.deck_ok !== false;
function fill(r){
  if (!r.motion) r.motion = r.pattern && r.pattern !== '정지' ? '모션' : '정지';
  r.role = r.role || ROLE_OF_TYPE[r.type] || '본문';
  r.kindL = kindOf(r);
  r.no = r.kit ? r.no : Number(r.no);
  return r;
}
const visible = r => showHidden || !r.hidden;
const label = r => r.kit ? `키트 ${r.kit} · ${r.slide}장` : '#' + r.no;
const url = r => esc(r.file) + (r.v ? '?v=' + esc(r.v) : '') + (r.hash ? '#' + esc(r.hash) : '');
// 무엇을 하려고 하나요? — 목적 하나 = 타일 하나. 페이지로 가거나(href), 아래 목록을 그 쓰임새로 좁힌다(role)
const PURPOSES = [
  {key: 'kit', title: '덱을 새로 만든다', sub: '분위기 하나 골라 채팅 AI로', href: 'kit/index.html', go: '누르면 덱 키트 페이지가 열립니다',
   imgs: ['kit/thumbs/A-1.jpg', 'kit/thumbs/B-1.jpg', 'kit/thumbs/C-1.jpg', 'kit/thumbs/D-1.jpg'],
   desc: '네 분위기(픽셀 게임 · 미니멀 스튜디오 · 놀이 오브젝트 · 인쇄·종이) 중 하나의 지시서를 채팅 AI에 주면, 같은 부품으로 새 발표 덱(.html)을 만들어 줍니다.'},
  {key: '표지', role: '표지', title: '표지 고르기', sub: '덱 첫 장, 분위기 정하기'},
  {key: '본문', role: '본문', title: '본문 장표 찾기', sub: '성과 · 사례 · 경과 한 장'},
  {key: '인쇄·홍보물', role: '인쇄·홍보물', title: '인쇄·홍보물 만들기', sub: '포스터 · 리플렛 · 소식지'},
  {key: 'wow', title: '발표에 연출 더하기', sub: '와우 기법 24가지 · 9장 덱', href: 'wow/wow.html', go: '누르면 와우 포인트 덱이 열립니다',
   imgs: ['thumbs/hub-wow-1.jpg', 'thumbs/hub-wow-2.jpg', 'thumbs/hub-wow-3.jpg'],
   desc: '청중이 "와" 하는 순간을 만드는 기법 24가지를 여섯 묶음(드러내기 · 대비 · 숫자 · 은유 · 감각 · 소리)으로 모았습니다. 장마다 기법이 실제로 움직입니다.'},
  {key: 'icons', title: '아이콘 가져다 쓰기', sub: '교육행정 85개 · SVG', href: 'icons/icons.html', go: '누르면 아이콘 세트가 열립니다',
   imgs: ['thumbs/hub-icons-1.jpg', 'thumbs/hub-icons-2.jpg'],
   desc: '본문 장표의 묶음 머리에 붙이는 교육행정 아이콘 85개(12묶음). 같은 규격(24 × 24, 선 1.75)이라 섞어 써도 고르고, SVG를 복사해 바로 넣습니다.'},
];
const thumbOf = r => esc(r.thumb) + (r.v ? '?v=' + esc(r.v) : '');
function buildHub(){
  PURPOSES.forEach(p => { if (p.role) {
    const rs = all.filter(r => r.role === p.role && !r.hidden && !r.kit);
    p.count = rs.length; p.imgs = rs.filter(r => r.deck_ok !== false).slice(0, 6).map(thumbOf);   // 미리보기에는 실패 사례를 빼고
    p.desc = ROLE_DESC[p.role] + '. 최근 장표부터 보여 줍니다.'; p.go = `누르면 아래 목록이 '${p.role}' ${p.count}개로 좁혀집니다`;
  } });
  $('#hub').innerHTML = PURPOSES.map(p => {
    const pv = p.href && !p.key.startsWith('kit') ? `<span class="pv one"><img src="${p.imgs[0]}" alt="" loading="lazy"></span>`
      : `<span class="pv">${p.imgs.slice(0, 4).map(u => `<img src="${u}" alt="" loading="lazy">`).join('')}</span>`;
    return `<a class="tile" data-k="${esc(p.key)}" href="${p.href ? esc(p.href) : '?role=' + encodeURIComponent(p.role) + '#list'}">${pv}<b>${esc(p.title)}</b><small>${p.count ? `<em>${p.count}</em>개 · ` : ''}${esc(p.sub)}</small></a>`;
  }).join('');
}
// 크게 보기: 마우스를 올리거나 키보드로 고르면 그 목적의 화면 여러 장을 넘겨 보여 준다(터치 화면에서는 타일 속 미리보기가 그 역할)
const peek = document.createElement('div'); peek.className = 'peek'; peek.setAttribute('aria-hidden', 'true'); document.body.appendChild(peek);
const fine = matchMedia('(hover: hover) and (pointer: fine)'), still = matchMedia('(prefers-reduced-motion: reduce)');
let peekT = 0, peekI = 0;
function showPeek(tile){
  const p = PURPOSES.find(x => x.key === tile.dataset.k); if (!p) return;
  clearTimeout(peekT); clearInterval(peekI);
  peek.innerHTML = `<div class="big">${p.imgs.map((u, i) => `<img src="${u}" alt=""${i ? '' : ' class="on"'}>`).join('')}</div>` +
    (p.imgs.length > 1 ? `<div class="strip">${p.imgs.map((u, i) => `<i${i ? '' : ' class="on"'}></i>`).join('')}</div>` : '') +
    `<div class="txt"><b>${esc(p.title)}</b><p>${esc(p.desc)}</p><span>${esc(p.go)}</span></div>`;
  const r = tile.getBoundingClientRect(), w = peek.offsetWidth, h = peek.offsetHeight || 460;
  const below = r.bottom + 10 + h < innerHeight || r.top < h + 20;
  peek.style.left = Math.max(16, Math.min(r.left, innerWidth - w - 16)) + scrollX + 'px';
  peek.style.top = (below ? r.bottom + 10 : r.top - 10 - h) + scrollY + 'px';
  peekT = setTimeout(() => peek.classList.add('on'), 120);
  if (p.imgs.length > 1 && !still.matches) {
    let k = 0; const ims = peek.querySelectorAll('.big img'), bars = peek.querySelectorAll('.strip i');
    peekI = setInterval(() => { ims[k].classList.remove('on'); bars[k].classList.remove('on'); k = (k + 1) % ims.length; ims[k].classList.add('on'); bars[k].classList.add('on'); }, 1400);
  }
}
function hidePeek(){ clearTimeout(peekT); clearInterval(peekI); peek.classList.remove('on'); }
$('#hub').addEventListener('mouseover', e => { const t = e.target.closest('.tile'); if (t && fine.matches && !t.contains(e.relatedTarget)) showPeek(t); });
$('#hub').addEventListener('mouseout', e => { const t = e.target.closest('.tile'); if (t && !t.contains(e.relatedTarget)) hidePeek(); });
$('#hub').addEventListener('focusin', e => { const t = e.target.closest('.tile'); if (t && t.matches(':focus-visible')) showPeek(t); });
$('#hub').addEventListener('focusout', hidePeek);
addEventListener('keydown', e => { if (e.key === 'Escape') hidePeek(); });
addEventListener('scroll', hidePeek, {passive: true});
// 쓰임새 타일은 페이지를 다시 열지 않고 아래 목록을 좁힌다(새 탭으로 열기는 주소 ?role= 로 그대로 동작)
$('#hub').addEventListener('click', e => {
  const t = e.target.closest('.tile'); const p = t && PURPOSES.find(x => x.key === t.dataset.k);
  if (!p || !p.role || e.ctrlKey || e.metaKey || e.shiftKey || e.button) return;
  e.preventDefault(); hidePeek(); setRole(p.role);
  $('#list').scrollIntoView({behavior: still.matches ? 'auto' : 'smooth', block: 'start'});
});
function setRole(v){ role = v; mark('#role', 'g', v); render(); }
// 주소에 지금 고른 것을 남긴다: 새로고침 · 링크 보내기에서 그대로(?role=본문&kind=핵심 성과&fam=B&q=간트)
function syncURL(){
  const u = new URLSearchParams();
  [['role', role], ['kind', kind], ['fam', fam], ['q', $('#q').value.trim()]].forEach(([k, v]) => v && u.set(k, v));
  if (showHidden) u.set('hidden', '1');
  const qs = u.toString(); history.replaceState(null, '', qs ? '?' + qs + location.hash : location.pathname + location.hash);
}
function readURL(){
  const u = new URLSearchParams(location.search);
  role = u.get('role') || ''; kind = u.get('kind') || ''; fam = u.get('fam') || ''; $('#q').value = u.get('q') || ''; showHidden = u.get('hidden') === '1';
}
const mark = (box, key, v) => document.querySelectorAll(box + ' button').forEach(x => x.setAttribute('aria-pressed', (x.dataset[key] || '') === v));

function matches(r, skip){
  const q = $('#q').value.trim().toLowerCase();
  return visible(r) && (skip === 'role' || !role || r.role === role) && (skip === 'kind' || !kind || r.kindL === kind) && (skip === 'fam' || !fam || famHas(r, fam)) &&
    (!q || [label(r), r.title, r.topic, r.kindL, r.info_type, (r.modules || []).join(' '), r.style, r.takeaway, r.metaphor, r.pattern, FAMILIES[r.family]].join(' ').toLowerCase().includes(q));
}
function counts(){
  document.querySelectorAll('#role button').forEach(b => { b.querySelector('em').textContent = all.filter(r => matches(r, 'role') && (!b.dataset.g || r.role === b.dataset.g)).length; });
  document.querySelectorAll('#kind button').forEach(b => { const v = b.dataset.k; const c = all.filter(r => matches(r, 'kind') && (!v || r.kindL === v)).length;
    b.querySelector('em').textContent = c; b.disabled = !!v && c === 0 && kind !== v;
    b.classList.toggle('gap', !!v && all.filter(r => visible(r) && r.kindL === v).length === 0); });
  document.querySelectorAll('#fam button').forEach(b => { const v = b.dataset.f; const c = all.filter(r => matches(r, 'fam') && (!v || famHas(r, v))).length;
    b.querySelector('em').textContent = c; b.disabled = !!v && c === 0 && fam !== v; });
  $('#kind').hidden = !!role && role !== '본문';
}
function render(){
  counts();
  if ($('#kind').hidden && kind) { kind = ''; mark('#kind', 'k', ''); counts(); }
  document.querySelectorAll('#hub .tile').forEach(t => t.setAttribute('aria-current', !!role && t.dataset.k === role));
  $('#note').innerHTML = kind ? `<b>${esc(kind)}</b>${all.filter(r => visible(r) && r.kindL === kind).length ? '' : ' 아직 없습니다. 채울 빈칸입니다.'}` : role ? `<b>${esc(role)}</b> ${esc(ROLE_DESC[role] || '')}` : '';
  const rows = all.filter(r => matches(r)).sort((a, b) => (a.kit ? 1 : 0) - (b.kit ? 1 : 0) || (fam ? (ORDER[a.role] ?? 9) - (ORDER[b.role] ?? 9) : 0) || (b.kit ? 0 : b.no - a.no));
  $('#grid').innerHTML = rows.length ? rows.map((r, i) => `
    <a class="card${r.deck_ok === false ? ' fail' : ''}${r.hidden ? ' hid' : ''}" href="${url(r)}" target="_blank" rel="noopener" data-i="${all.indexOf(r)}">
      <span class="th"><img src="${thumbOf(r)}" alt="" loading="lazy">${MO[r.motion] ? `<span class="mo" title="${esc(r.motion)}">${MO[r.motion]}</span>` : ''}</span>
      <span class="cap"><b>${esc(String(r.title).replace(/^레퍼런스\s*#\d+\s*/, ''))}</b><small>${esc(label(r))}</small></span>
      ${r.hidden ? `<span class="why">숨김 · ${esc(r.hide_reason || '')}</span>` : ''}
    </a>`).join('') : '<p class="empty">조건에 맞는 장표가 없습니다.</p>';
  const nh = all.filter(r => r.hidden).length;
  $('#hidNote').innerHTML = nh ? ` 기준에 걸려 숨긴 장표 ${nh}개 · <button type="button" id="hidBtn">${showHidden ? '숨기기' : '보기'}</button>` : '';
  syncURL();
}
// 빠르게 보기: 카드를 누르면 그 자리에서 원본을 띄워 움직여 본다(새 탭 · 가운데 단추는 그대로 원본)
function openQL(r){
  $('#qlFrame').src = url(r);
  const tags = [r.role, r.kindL, r.family && `${r.family} ${FAMILIES[r.family]}`, r.motion !== '정지' && `${MO[r.motion]} ${r.motion}`].filter(Boolean);
  $('#qlSide').innerHTML = `<h2 id="qlTitle">${esc(String(r.title).replace(/^레퍼런스\s*#\d+\s*/, ''))} <small style="color:var(--soft);font-size:13px">${esc(label(r))}</small></h2>
    <div class="tags">${tags.map(t => `<span>${esc(t)}</span>`).join('')}</div>
    ${r.takeaway ? `<p><b>가져갈 장치</b> · ${esc(r.takeaway)}</p>` : r.summary ? `<p>${esc(String(r.summary).slice(0, 180))}${String(r.summary).length > 180 ? '…' : ''}</p>` : ''}
    ${r.deck_note && r.deck_ok === false ? `<p style="color:#A1251B">${esc(r.deck_note)}</p>` : ''}
    ${r.hidden ? `<p style="color:#A1251B">숨김 · ${esc(r.hide_reason || '')}</p>` : ''}
    ${(r.palette || []).length ? `<div class="sw">${r.palette.slice(0, 6).map(c => `<i style="background:${hex(c)}"></i>`).join('')}</div>` : ''}
    <div class="acts"><a href="${url(r)}" target="_blank" rel="noopener">새 창으로 열기</a><button type="button" id="qlClose">닫기</button></div>`;
  $('#ql').showModal(); $('#qlClose').focus();
}
// 미리보기 안을 눌러 초점이 들어가도 Esc 로 닫히게(같은 출처 페이지)
$('#qlFrame').addEventListener('load', () => { try { $('#qlFrame').contentWindow.addEventListener('keydown', e => { if (e.key === 'Escape') $('#ql').close(); }); } catch (e) {} });
$('#ql').addEventListener('close', () => { $('#qlFrame').src = 'about:blank'; });
$('#ql').addEventListener('click', e => { if (e.target.id === 'qlClose' || e.target === $('#ql')) $('#ql').close(); });
$('#grid').addEventListener('click', e => {
  const c = e.target.closest('.card'); if (!c || e.ctrlKey || e.metaKey || e.shiftKey || e.button) return;
  e.preventDefault(); openQL(all[+c.dataset.i]);
});
document.addEventListener('click', e => { if (e.target.id === 'hidBtn') { showHidden = !showHidden; render(); } });

Promise.all([
  fetch('data/rounds.json', {cache: 'no-cache'}).then(r => r.json()),
  fetch('data/kit_slides.json', {cache: 'no-cache'}).then(r => r.ok ? r.json() : []).catch(() => [])
]).then(([d, ks]) => {
  all = d.map(fill).concat(ks.map(fill));
  document.querySelectorAll('#role button').forEach(b => b.insertAdjacentHTML('beforeend', '<em></em>'));
  $('#kind').insertAdjacentHTML('beforeend', `<button type="button" data-k="" aria-pressed="true">전체<em></em></button>` +
    KINDS.map(k => `<button type="button" data-k="${esc(k)}" aria-pressed="false">${esc(k)}<em></em></button>`).join(''));
  const cov = no => all.find(r => r.no === no);
  $('#fam').insertAdjacentHTML('beforeend', `<button type="button" class="all" data-f="" aria-pressed="true">전체<em></em></button>` +
    Object.keys(FAMILIES).map(k => { const c = cov(FAM_COVER[k]); return `<button type="button" data-f="${k}" aria-pressed="false" title="${esc(FAMILIES[k])}">${c ? `<img src="${thumbOf(c)}" alt="">` : ''}${k} ${esc(FAMILIES[k].split(/[ ·]/)[0])}<em></em></button>`; }).join(''));
  buildHub();
  readURL(); mark('#role', 'g', role); mark('#kind', 'k', kind); mark('#fam', 'f', fam);
  render();
  if (location.hash === '#list') $('#list').scrollIntoView();
}).catch(() => { $('#grid').innerHTML = '<p class="empty">목록을 불러오지 못했습니다.</p>'; });

const pick = (box, key, set) => $(box).addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || b.disabled) return;
  set(b.dataset[key] || ''); mark(box, key, b.dataset[key] || ''); render();
});
pick('#role', 'g', v => role = v);
pick('#kind', 'k', v => kind = v);
pick('#fam', 'f', v => fam = v);
$('#q').addEventListener('input', render);
</script>
</body>
</html>
